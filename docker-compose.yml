# ThinkLab local stack: MongoDB (single-node replica set), NATS JetStream and the fourteen services.
#
#   scripts/stack/build.sh        # or scripts\stack\build.ps1: gradlew installDist in every sibling repo
#   docker compose up -d --build
#   scripts/stack/wait-ready.sh   # until every service reports /health/readiness UP
#
# Each image packages its service's build/install output (see the Dockerfile in every repo), so nothing
# is compiled inside Docker and no GitHub Packages credential ever reaches an image.
# Host ports follow the platform port map; inside the network every service listens on 8080.
name: thinklab

x-service: &service
  restart: unless-stopped
  depends_on:
    mongo:
      condition: service_healthy
  environment: &service-env
    HASH_SERVICE_URL: http://hash-token-registry:8080
    THINKLAB_JWKS_URL: http://party-authentication:8080/party-authentication/v1/.well-known/jwks.json
    THINKLAB_REVOCATION_URL: http://party-authentication:8080/party-authentication/v1/session/revoked
    THINKLAB_TOKEN_URL: http://party-authentication:8080/party-authentication/v1/token/service

services:
  # A replica set, even with a single node, is what enables multi-document transactions; without it the
  # kit's transactional outbox (party-authentication user creation) fails. The healthcheck initiates the
  # set on first start and only reports healthy once this node is the writable primary.
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "thinklab-rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status() } catch (e) { rs.initiate({ _id: 'thinklab-rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) };
          quit(db.hello().isWritablePrimary ? 0 : 1)
      interval: 3s
      timeout: 10s
      retries: 40

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["4222:4222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 3s
      timeout: 5s
      retries: 20

  hash-token-registry:
    <<: *service
    build: ../micronaut-hash-token-registry-service
    image: thinklab/hash-token-registry:local
    ports: ["8080:8080"]
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/thinklab_hash_db?replicaSet=thinklab-rs0

  party-reference-data-directory:
    <<: *service
    build: ../micronaut-party-reference-data-directory-service
    image: thinklab/party-reference-data-directory:local
    ports: ["8081:8080"]
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/thinklab_company_db?replicaSet=thinklab-rs0

  # Events on: user creation writes the user and its user.initiated event in one transaction (outbox),
  # and the relay publishes it to JetStream. Enabling events on a service without io.nats:jnats on its
  # classpath fails at startup - see each service's own THINKLAB_EVENTS_ENABLED block below.
  party-authentication:
    <<: *service
    build: ../micronaut-party-authentication-service
    image: thinklab/party-authentication:local
    ports: ["8082:8080"]
    depends_on:
      mongo: { condition: service_healthy }
      nats: { condition: service_healthy }
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/thinklab_party_authentication_db?replicaSet=thinklab-rs0
      THINKLAB_EVENTS_ENABLED: "true"
      THINKLAB_EVENTS_NATS_URL: nats://nats:4222

  # Consumes it-hardware-maintenance's repair-started/repair-completed events (that service's ADR-034)
  # to drive Asset MAINTENANCE status (this service's ADR-026).
  it-asset-registry:
    <<: *service
    build: ../micronaut-it-asset-registry-service
    image: thinklab/it-asset-registry:local
    ports: ["8083:8080"]
    depends_on:
      mongo: { condition: service_healthy }
      nats: { condition: service_healthy }
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/thinklab_asset_db?replicaSet=thinklab-rs0
      CI_TYPE_CATALOG_SERVICE_URL: http://ci-type-catalog:8080
      THINKLAB_EVENTS_ENABLED: "true"
      THINKLAB_EVENTS_NATS_URL: nats://nats:4222

  it-operation-window:
    <<: *service
    build: ../micronaut-it-operation-window-service
    image: thinklab/it-operation-window:local
    ports: ["8084:8080"]
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/thinklab_operation_db?replicaSet=thinklab-rs0

  # Publishes repair-started/repair-completed (ADR-034) for it-asset-registry to consume.
  it-hardware-maintenance:
    <<: *service
    build: ../micronaut-it-hardware-maintenance-service
    image: thinklab/it-hardware-maintenance:local
    ports: ["8085:8080"]
    depends_on:
      mongo: { condition: service_healthy }
      nats: { condition: service_healthy }
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/thinklab_hardware_maintenance_db?replicaSet=thinklab-rs0
      THINKLAB_EVENTS_ENABLED: "true"
      THINKLAB_EVENTS_NATS_URL: nats://nats:4222

  site-reference-data-directory:
    <<: *service
    build: ../micronaut-site-reference-data-directory-service
    image: thinklab/site-reference-data-directory:local
    ports: ["8087:8080"]
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/thinklab_site_db?replicaSet=thinklab-rs0

  # workflow-approval and it-change-management (Journey 7): no events either (ADR-032 of both) - GMUD
  # calls both workflow-approval and it-operation-window synchronously over HTTP at request time.
  workflow-approval:
    <<: *service
    build: ../micronaut-workflow-approval-service
    image: thinklab/workflow-approval:local
    ports: ["8090:8080"]
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/thinklab_workflow_approval_db?replicaSet=thinklab-rs0

  # CAB/ECAB policy ids have no default here (see that service's README): docker-compose has no way to
  # provision them at container start, unlike start-local-stack.ps1's own bootstrap step. Set
  # THINKLAB_CAB_POLICY_ID/THINKLAB_ECAB_POLICY_ID on the host environment before `docker compose up` if
  # you need route-for-approval to work under Compose; STANDARD changes (pre-approved) need neither.
  it-change-management:
    <<: *service
    build: ../micronaut-it-change-management-service
    image: thinklab/it-change-management:local
    ports: ["8086:8080"]
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/thinklab_it_change_management_db?replicaSet=thinklab-rs0
      WORKFLOW_APPROVAL_SERVICE_URL: http://workflow-approval:8080
      OPERATION_WINDOW_SERVICE_URL: http://it-operation-window:8080
      THINKLAB_CAB_POLICY_ID: ${THINKLAB_CAB_POLICY_ID:-}
      THINKLAB_ECAB_POLICY_ID: ${THINKLAB_ECAB_POLICY_ID:-}

  # Journey 10 (no events, ADR-032 of it-discovery): promotion calls it-asset-registry synchronously, and
  # it-asset-registry validates Asset.specifications against ci-type-catalog (fail-open, ADR-027).
  it-discovery:
    <<: *service
    build: ../micronaut-it-discovery-service
    image: thinklab/it-discovery:local
    ports: ["8091:8080"]
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/thinklab_it_discovery_db?replicaSet=thinklab-rs0
      ASSET_REGISTRY_SERVICE_URL: http://it-asset-registry:8080

  it-topology-graph:
    <<: *service
    build: ../micronaut-it-topology-graph-service
    image: thinklab/it-topology-graph:local
    ports: ["8092:8080"]
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/thinklab_it_topology_graph_db?replicaSet=thinklab-rs0

  ci-type-catalog:
    <<: *service
    build: ../micronaut-ci-type-catalog-service
    image: thinklab/ci-type-catalog:local
    ports: ["8093:8080"]
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/thinklab_ci_type_catalog_db?replicaSet=thinklab-rs0

  # ADR-035 of the ledger: the object store the chain-head anchors are published to, with OBJECT LOCK (write once: an anchor cannot be
  # overwritten or deleted until its retention ends). LocalStack stands in for any S3-compatible store (AWS S3, Ceph...); the bucket is
  # created WITH Object Lock by scripts/e2e/anchor-store-init.sh when it is ready (that can only be chosen at creation), and the healthcheck
  # only passes once the bucket exists. In production point LEDGER_ANCHOR_S3_ENDPOINT/BUCKET at a real bucket created with Object Lock.
  anchor-store:
    image: localstack/localstack:3.8.1
    restart: unless-stopped
    environment:
      SERVICES: s3
    ports: ["9100:4566"]
    volumes:
      - ./scripts/e2e/anchor-store-init.sh:/etc/localstack/init/ready.d/10-anchor-bucket.sh:ro
    healthcheck:
      test: ["CMD", "awslocal", "s3api", "head-bucket", "--bucket", "thinklab-anchors"]
      interval: 3s
      timeout: 10s
      retries: 40

  # Journey 8: append-only, hash-chained audit ledger. The gateway appends to it (fire-and-forget, fail-open).
  compliance-audit-ledger:
    <<: *service
    build: ../micronaut-compliance-audit-ledger-service
    image: thinklab/compliance-audit-ledger:local
    ports: ["8094:8080"]
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/thinklab_compliance_audit_ledger_db?replicaSet=thinklab-rs0
      # ADR-034/035: chain heads are anchored OUTSIDE the ledger database, into an object-lock bucket (anchor-store). Set a real
      # LEDGER_ANCHOR_KEY (never stored in the database; rotate it with LEDGER_ANCHOR_KEY_ID + LEDGER_ANCHOR_PREVIOUS_KEYS_<ID>);
      # these are development defaults. LEDGER_ANCHOR_SINK=file with LEDGER_ANCHOR_DIRECTORY mounted on a write-once volume still works.
      LEDGER_ANCHOR_ENABLED: "true"
      LEDGER_ANCHOR_SINK: s3
      LEDGER_ANCHOR_KEY: ${LEDGER_ANCHOR_KEY:-dev-only-anchor-key-change-me}
      LEDGER_ANCHOR_S3_ENDPOINT: http://anchor-store:4566
      LEDGER_ANCHOR_S3_PATH_STYLE: "true"
      LEDGER_ANCHOR_S3_BUCKET: thinklab-anchors
      LEDGER_ANCHOR_S3_ACCESS_KEY: ${ANCHOR_STORE_USER:-test}
      LEDGER_ANCHOR_S3_SECRET_KEY: ${ANCHOR_STORE_PASSWORD:-test}
    depends_on:
      mongo:
        condition: service_healthy
      anchor-store:
        condition: service_healthy

  # Journey 9: plans, subscriptions and the entitlement lookup. No money, no events (ADR-030).
  subscription-billing:
    <<: *service
    build: ../micronaut-subscription-billing-service
    image: thinklab/subscription-billing:local
    ports: ["8095:8080"]
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/thinklab_subscription_billing_db?replicaSet=thinklab-rs0

  # Journey 13 (consumables): stock items, movements and the low-stock list. No money, no events (ADR-032).
  consumable-inventory:
    <<: *service
    build: ../micronaut-consumable-inventory-service
    image: thinklab/consumable-inventory:local
    ports: ["8096:8080"]
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/thinklab_consumable_inventory_db?replicaSet=thinklab-rs0

  # Journey 12 (ITSM core), first service: incidents with a derived priority, SLA judged when read and requester self-service.
  it-incident-management:
    <<: *service
    build: ../micronaut-it-incident-management-service
    image: thinklab/it-incident-management:local
    ports: ["8098:8080"]
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/thinklab_it_incident_management_db?replicaSet=thinklab-rs0

  # Journey 12 (ITSM core), second service: a service catalog and requests made from it. Approval (a policy that may be a chain) is
  # delegated to workflow-approval, called only when an item has a policy.
  it-service-request:
    <<: *service
    build: ../micronaut-it-service-request-service
    image: thinklab/it-service-request:local
    ports: ["8099:8080"]
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/thinklab_it_service_request_db?replicaSet=thinklab-rs0
      WORKFLOW_APPROVAL_SERVICE_URL: http://workflow-approval:8080

  # Journey 12 (ITSM core), third service: problems, the cause behind incidents, with the known error as a real state. Staff only.
  it-problem-management:
    <<: *service
    build: ../micronaut-it-problem-management-service
    image: thinklab/it-problem-management:local
    ports: ["8100:8080"]
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/thinklab_it_problem_management_db?replicaSet=thinklab-rs0

  # Journey 12 (ITSM core), fourth service: the knowledge base. Articles with review by another person, versions, two audiences and text search.
  it-knowledge-base:
    <<: *service
    build: ../micronaut-it-knowledge-base-service
    image: thinklab/it-knowledge-base:local
    ports: ["8101:8080"]
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/thinklab_it_knowledge_base_db?replicaSet=thinklab-rs0

  # Journey 12 (ITSM core), fifth service: the ServiceNow and Jira connector. It reads and acts on incidents, requests and problems through
  # their own routes. Its credentials are NEVER stored: a connection names environment variables, and these are the ones the test double uses.
  it-external-ticketing:
    <<: *service
    build: ../micronaut-it-external-ticketing-service
    image: thinklab/it-external-ticketing:local
    ports: ["8102:8080"]
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/thinklab_it_external_ticketing_db?replicaSet=thinklab-rs0
      INCIDENT_SERVICE_URL: http://it-incident-management:8080
      SERVICE_REQUEST_SERVICE_URL: http://it-service-request:8080
      PROBLEM_SERVICE_URL: http://it-problem-management:8080
      # The ticketing double (profile ticketing-test) is plain http on this host name; a real deployment leaves this empty.
      THINKLAB_EXTERNAL_TICKETING_INSECURE_HOSTS: mock-ticketing
      # The credentials and webhook tokens of the double. A real provider's are provided the same way under the variable names its connection names.
      THINKLAB_MOCK_JIRA_AUTH: ${THINKLAB_MOCK_JIRA_AUTH:-Basic bW9jay1qaXJhOm1vY2s=}
      THINKLAB_MOCK_JIRA_HOOK: ${THINKLAB_MOCK_JIRA_HOOK:-mock-jira-webhook-token}
      THINKLAB_MOCK_SNOW_AUTH: ${THINKLAB_MOCK_SNOW_AUTH:-Basic bW9jay1zbm93Om1vY2s=}
      THINKLAB_MOCK_SNOW_HOOK: ${THINKLAB_MOCK_SNOW_HOOK:-mock-snow-webhook-token}

  # TEST DOUBLE, never part of a real deployment (profile ticketing-test): a Jira and a ServiceNow in one process for the connector smoke.
  mock-ticketing:
    profiles: ["ticketing-test"]
    image: node:22-alpine
    command: ["node", "/app/mock-ticketing.mjs"]
    ports: ["9190:9100"]
    environment:
      MOCK_TICKETING_JIRA_AUTH: ${THINKLAB_MOCK_JIRA_AUTH:-Basic bW9jay1qaXJhOm1vY2s=}
      MOCK_TICKETING_SNOW_AUTH: ${THINKLAB_MOCK_SNOW_AUTH:-Basic bW9jay1zbm93Om1vY2s=}
    volumes:
      - ./scripts/e2e/mock-ticketing.mjs:/app/mock-ticketing.mjs:ro

  # Journey 14 (operations), first service: health monitoring. It probes HTTP and TCP targets itself, on a schedule. Staff only.
  it-health-monitoring:
    <<: *service
    build: ../micronaut-it-health-monitoring-service
    image: thinklab/it-health-monitoring:local
    ports: ["8103:8080"]
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/thinklab_it_health_monitoring_db?replicaSet=thinklab-rs0

  # Journey 14, second service: alerting. Polls the health monitor and opens ONE incident per outage on the incident service; both are reached through
  # their own routes at request time (no events, no startup dependency). Staff only.
  it-alerting:
    <<: *service
    build: ../micronaut-it-alerting-service
    image: thinklab/it-alerting:local
    ports: ["8104:8080"]
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/thinklab_it_alerting_db?replicaSet=thinklab-rs0
      HEALTH_MONITORING_SERVICE_URL: http://it-health-monitoring:8080
      INCIDENT_SERVICE_URL: http://it-incident-management:8080
      # Webhook notices (alerting ADR-036): the rules name these variables, never the address. They point at the test double (profile health-test),
      # which is reachable over plain http only because its host is listed here; a real deployment sets https addresses and leaves the list empty.
      THINKLAB_ALERT_HOOK_OPS: http://mock-target:9200/hook/ops
      THINKLAB_ALERT_HOOK_ONCALL: http://mock-target:9200/hook/oncall
      THINKLAB_ALERTING_INSECURE_HOSTS: mock-target

  # TEST DOUBLE, never part of a real deployment (profile health-test): something for the health monitor to watch, whose answer the smoke controls.
  mock-target:
    profiles: ["health-test"]
    image: node:22-alpine
    command: ["node", "/app/mock-target.mjs"]
    ports: ["9290:9200", "9291:9201"]
    volumes:
      - ./scripts/e2e/mock-target.mjs:/app/mock-target.mjs:ro

  # Journey 13b: OIDC sign-in through the organisation's own identity provider. It authenticates the person, then asks
  # party-authentication to open the session (one issuer). The client secret is NEVER stored: a provider names an environment variable.
  identity-federation:
    <<: *service
    build: ../micronaut-identity-federation-service
    image: thinklab/identity-federation:local
    ports: ["8097:8080"]
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/thinklab_identity_federation_db?replicaSet=thinklab-rs0
      PARTY_AUTHENTICATION_SERVICE_URL: http://party-authentication:8080
      THINKLAB_FEDERATION_REDIRECT_URI: ${THINKLAB_FEDERATION_REDIRECT_URI:-http://localhost:3000/api/identity-federation/v1/login/callback}
      # The OIDC provider double (profile sso-test) is plain http on this host name; a real deployment leaves this empty.
      THINKLAB_FEDERATION_INSECURE_HOSTS: mock-oidc
      # The secret of the provider double. A real provider's secret is provided the same way under the variable name its record names.
      THINKLAB_MOCK_OIDC_SECRET: ${THINKLAB_MOCK_OIDC_SECRET:-mock-client-secret}

  # TEST DOUBLE, never part of a real deployment (profile sso-test): a minimal OpenID Connect provider for the federation smoke.
  mock-oidc:
    profiles: ["sso-test"]
    image: node:22-alpine
    command: ["node", "/app/mock-oidc-provider.mjs"]
    ports: ["9000:9000"]
    environment:
      MOCK_OIDC_ISSUER: http://mock-oidc:9000
      MOCK_OIDC_CLIENT_SECRET: ${THINKLAB_MOCK_OIDC_SECRET:-mock-client-secret}
    volumes:
      - ./scripts/e2e/mock-oidc-provider.mjs:/app/mock-oidc-provider.mjs:ro

  # Stateless proxy: no database. Its readiness probes party-authentication's liveness.
  gateway: &gateway
    build: ../micronaut-platform-gateway-service
    image: thinklab/platform-gateway:local
    restart: unless-stopped
    ports: ["8088:8080"]
    environment: &gateway-env
      THINKLAB_JWKS_URL: http://party-authentication:8080/party-authentication/v1/.well-known/jwks.json
      THINKLAB_REVOCATION_URL: http://party-authentication:8080/party-authentication/v1/session/revoked
      GATEWAY_PARTY_AUTHENTICATION_URL: http://party-authentication:8080
      GATEWAY_PARTY_REFERENCE_URL: http://party-reference-data-directory:8080
      GATEWAY_IT_ASSET_URL: http://it-asset-registry:8080
      GATEWAY_IT_OPERATION_WINDOW_URL: http://it-operation-window:8080
      GATEWAY_IT_HARDWARE_MAINTENANCE_URL: http://it-hardware-maintenance:8080
      GATEWAY_SITE_REFERENCE_URL: http://site-reference-data-directory:8080
      GATEWAY_NOTIFICATION_DISPATCH_URL: http://notification-dispatch:8080
      GATEWAY_WORKFLOW_APPROVAL_URL: http://workflow-approval:8080
      GATEWAY_IT_CHANGE_MANAGEMENT_URL: http://it-change-management:8080
      GATEWAY_IT_DISCOVERY_URL: http://it-discovery:8080
      GATEWAY_IT_TOPOLOGY_GRAPH_URL: http://it-topology-graph:8080
      GATEWAY_CI_TYPE_CATALOG_URL: http://ci-type-catalog:8080
      GATEWAY_COMPLIANCE_AUDIT_LEDGER_URL: http://compliance-audit-ledger:8080
      GATEWAY_SUBSCRIPTION_BILLING_URL: http://subscription-billing:8080
      GATEWAY_CONSUMABLE_INVENTORY_URL: http://consumable-inventory:8080
      GATEWAY_IDENTITY_FEDERATION_URL: http://identity-federation:8080
      GATEWAY_IT_INCIDENT_MANAGEMENT_URL: http://it-incident-management:8080
      GATEWAY_IT_SERVICE_REQUEST_URL: http://it-service-request:8080
      GATEWAY_IT_PROBLEM_MANAGEMENT_URL: http://it-problem-management:8080
      GATEWAY_IT_KNOWLEDGE_BASE_URL: http://it-knowledge-base:8080
      GATEWAY_IT_EXTERNAL_TICKETING_URL: http://it-external-ticketing:8080
      GATEWAY_IT_HEALTH_MONITORING_URL: http://it-health-monitoring:8080
      GATEWAY_IT_ALERTING_URL: http://it-alerting:8080
      # Plain-http compose stack: the refresh cookie cannot be Secure here (set true behind https). Path is as the browser sees it.
      GATEWAY_SESSION_COOKIE_SECURE: "false"
      GATEWAY_AUDIT_LEDGER_URL: http://compliance-audit-ledger:8080
      GATEWAY_AUDIT_ENABLED: "true"
      # ADR-027: the pseudonym lookup for investigations (off unless asked for); recorded on the ledger before anything is disclosed.
      GATEWAY_INVESTIGATION_ENABLED: "true"
      # Development default so the demo stack works out of the box; set a real secret anywhere that matters (ledger ADR-033).
      GATEWAY_AUDIT_PSEUDONYM_KEY: ${GATEWAY_AUDIT_PSEUDONYM_KEY:-dev-only-pseudonym-key-change-me}

  # Plan-based feature gating (gateway ADR-026), kept apart from the main gateway so every other smoke keeps working: a second gateway
  # with gating ON and a 1 second cache, only for `docker compose --profile plan-gating` (plan-gating-smoke.sh talks to port 8188).
  gateway-plans:
    <<: *gateway
    profiles: ["plan-gating"]
    ports: ["8188:8080"]
    environment:
      <<: *gateway-env
      GATEWAY_BILLING_URL: http://subscription-billing:8080
      GATEWAY_ENTITLEMENTS_ENABLED: "true"
      GATEWAY_ENTITLEMENTS_CACHE_TTL: 1s
      GATEWAY_AUDIT_ENABLED: "false"

  # Consumes party-authentication's user.initiated events and sends the welcome notification.
  notification-dispatch:
    <<: *service
    build: ../micronaut-notification-dispatch-service
    image: thinklab/notification-dispatch:local
    ports: ["8089:8080"]
    depends_on:
      mongo: { condition: service_healthy }
      nats: { condition: service_healthy }
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/thinklab_notification_db?replicaSet=thinklab-rs0
      THINKLAB_EVENTS_ENABLED: "true"
      THINKLAB_EVENTS_NATS_URL: nats://nats:4222

  # ThinkLab web app (Journey 11): static bundle served by nginx, which forwards /api to the gateway. Behind the "web"
  # profile so a plain `docker compose up` (and the e2e workflow, which clones only the service repositories) never
  # needs ../thinklab-web: use `docker compose --profile web up`.
  web:
    profiles: ["web"]
    build: ../thinklab-web
    image: thinklab/web:local
    restart: unless-stopped
