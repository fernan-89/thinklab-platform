name: platform-ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The editions (scripts/stack/edition.sh) name the services they start: every one must still be defined in docker-compose.yml, or
      # `up` would fail on a machine that tries it. Memory is measured by hand, not here (it needs the images built).
      - name: Every service of every edition is in docker-compose.yml, and each edition contains the one before it
        run: |
          defined=$(docker compose -f docker-compose.yml config --services)
          missing=0
          for edition in homelab team enterprise; do
            for service in $(scripts/stack/edition.sh "$edition" services); do
              if ! grep -qx "$service" <<<"$defined"; then echo "not in docker-compose.yml: $service ($edition)"; missing=1; fi
            done
            echo "$edition: $(scripts/stack/edition.sh "$edition" services | wc -l) services"
          done
          for pair in "homelab team" "team enterprise"; do
            set -- $pair
            for service in $(scripts/stack/edition.sh "$1" services); do
              scripts/stack/edition.sh "$2" services | grep -qx "$service" || { echo "$service is in $1 but not in $2"; missing=1; }
            done
          done
          [ "$missing" -eq 0 ]
      - name: An edition turns an unknown command, and an unknown edition, away
        run: |
          set +e
          scripts/stack/edition.sh homelab nonsense >/dev/null 2>&1
          [ "$?" -eq 2 ]
          scripts/stack/edition.sh cloud up >/dev/null 2>&1
          [ "$?" -eq 2 ]
      - name: The JVM options can be set from the environment, the default is unchanged
        run: |
          docker compose -f docker-compose.yml config | grep -c 'JAVA_TOOL_OPTIONS: -Xmx256m' | grep -qv '^0$'
          THINKLAB_JAVA_OPTS='-Xmx160m' docker compose -f docker-compose.yml config | grep -q 'JAVA_TOOL_OPTIONS: -Xmx160m'
      # PowerShell is on the runner. A script that does not parse would only be found by someone on Windows.
      - name: The PowerShell scripts parse
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path scripts -Recurse -Filter *.ps1
          $bad = 0
          foreach ($file in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $bad++; Write-Output "$($file.FullName): $($errors[0].Message)" }
          }
          Write-Output "$($files.Count) scripts, $bad that do not parse"
          if ($bad -gt 0) { exit 1 }
      - name: The new scripts parse
        run: |
          for script in scripts/stack/edition.sh scripts/stack/homelab.sh scripts/stack/seed-starter-pack.sh scripts/connectors/netdata-sync.sh \
                        scripts/e2e/starter-pack-smoke.sh scripts/e2e/netdata-connector-smoke.sh scripts/e2e/dr-smoke.sh; do
            bash -n "$script"
          done

  # The scripts are meant for Windows too, where `powershell` is version 5.1 (no `-SkipHttpErrorCheck`, `??` or `?:`). The job above parses
  # them with PowerShell 7 and cannot see that; this one uses the shell Windows ships with.
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: The PowerShell scripts parse in Windows PowerShell 5.1 and need nothing from PowerShell 7
        shell: powershell
        run: |
          "PowerShell $($PSVersionTable.PSVersion)"
          $files = Get-ChildItem -Path scripts -Recurse -Filter *.ps1
          $bad = 0
          foreach ($file in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $bad++; Write-Output "$($file.FullName): $($errors[0].Message)" }
          }
          # Parameters that exist only in PowerShell 7 are allowed only behind a check that the command has them.
          $only7 = 'SkipHttpErrorCheck', 'SkipCertificateCheck', 'AllowUnencryptedAuthentication', 'SkipHeaderValidation'
          foreach ($name in $only7) {
            $hits = $files | Select-String -Pattern "-$name" | Where-Object { $_.Line -notmatch "ContainsKey\('$name'\)" -and $_.Line.TrimStart() -notmatch '^#' }
            foreach ($hit in $hits) { $bad++; Write-Output "$($hit.Path):$($hit.LineNumber): -$name needs PowerShell 7" }
          }
          Write-Output "$($files.Count) scripts, $bad problems"
          if ($bad -gt 0) { exit 1 }

  # A workflow file that is not valid YAML is not "red" on GitHub: it runs zero jobs and reports "workflow file issue". e2e.yml was like that for
  # 18 days (a step name with ": " in the middle of an unquoted value) and nothing here noticed. This reads every workflow with a real YAML parser.
  workflow-yaml:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: The workflow files are valid YAML
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for path in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  yaml.safe_load(open(path, encoding='utf-8'))
                  print('ok   ' + path)
              except yaml.YAMLError as error:
                  bad += 1
                  print('FAIL ' + path + ': ' + str(error).replace('\n', ' '))
          sys.exit(1 if bad else 0)
          PY
