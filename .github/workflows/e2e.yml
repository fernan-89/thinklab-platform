name: e2e

# The whole platform, end to end: every service built from its repository's master, started with
# docker-compose.yml (MongoDB replica set, NATS JetStream and every service), then exercised with each
# service's Postman suite, the two event-integration smokes and the gateway smoke.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Nightly, so a change merged in any service repository is caught here within a day.
  schedule:
    - cron: '17 4 * * *'

# packages: read resolves micronaut-thinklab-service-kit from GitHub Packages with the workflow token.
permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # The scripts expect the service repositories as siblings of thinklab-platform. The list comes
      # from scripts/stack/services.sh, so wiring a new service into the stack needs no change here.
      - uses: actions/checkout@v7
        with: { path: thinklab-platform }
      - name: Clone the service repositories (master)
        run: |
          source thinklab-platform/scripts/stack/services.sh
          for entry in "${THINKLAB_SERVICES[@]}"; do
            repo="${entry%%|*}"
            git clone --quiet --depth 1 "https://github.com/${{ github.repository_owner }}/$repo.git" "$repo"
            echo "$repo $(git -C "$repo" rev-parse --short HEAD)"
          done

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build every service (installDist)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: thinklab-platform/scripts/stack/build.sh

      - name: Start the stack
        working-directory: thinklab-platform
        run: docker compose up -d --build

      - name: Wait until every service is ready
        run: thinklab-platform/scripts/stack/wait-ready.sh 240

      - name: Install newman
        run: npm install -g newman

      - name: Postman suites
        run: thinklab-platform/scripts/e2e/run-e2e.sh

      - name: Event backbone smoke (user.initiated -> welcome notification)
        run: thinklab-platform/scripts/e2e/events-smoke.sh

      - name: Hardware maintenance smoke (WorkOrder repair -> Asset MAINTENANCE -> DEPLOYED)
        run: thinklab-platform/scripts/e2e/hardware-maintenance-smoke.sh

      - name: Gateway smoke
        run: thinklab-platform/scripts/e2e/gateway-smoke.sh

      - name: Service logs
        if: failure()
        working-directory: thinklab-platform
        run: mkdir -p .e2e && docker compose logs --no-color > .e2e/compose.log 2>&1 || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: thinklab-platform/.e2e/
          if-no-files-found: ignore
